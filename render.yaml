# Render Blueprint: API only (the web app is deployed on Cloudflare).
services:
  - type: web
    name: rg360-playoff-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - bun.lock
        - Dockerfile.api
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: club_platform
